<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QR Code Generator</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 32px; max-width: 900px; margin: 0 auto; }
      h1 { margin-bottom: 8px; }
      .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
      label { display:block; margin-bottom:8px; font-weight:600 }
      input[type=text], textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #e6e6e6; box-sizing:border-box }
      button { padding:10px 14px; border-radius:8px; border: none; background:#0066ff; color:white; cursor:pointer }
      button:disabled { background:#cbd5e1 }
      #qrcode { margin-top: 18px; }
      footer { margin-top:24px; color:#666; font-size:90% }
    </style>
  </head>
  <body>
    <h1>QR Code Generator</h1>
    <div class="card">
      <p>Enter text or a URL and click "Generate" to create a QR code right in your browser. This repo is prepared for deployment to Vercel as a static site.</p>

      <label for="text">Text / URL</label>
      <textarea id="text" rows="3" placeholder="https://example.com or any text..."></textarea>
      <div style="margin-top:12px; display:flex; gap:10px; align-items:center">
        <button id="generate">Generate</button>
        <button id="download" disabled>Download PNG</button>
      </div>

      <div id="qrcode"></div>
    </div>

    <footer>
      Built with <a href="https://davidshimjs.github.io/qrcodejs/" target="_blank" rel="noopener noreferrer">qrcodejs</a>. Deploy to Vercel by importing this repository or using the Vercel CLI.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      const textarea = document.getElementById('text');
      const btn = document.getElementById('generate');
      const downloadBtn = document.getElementById('download');
      const container = document.getElementById('qrcode');
      let qr;

      function generate() {
        const value = textarea.value.trim();
        if (!value) return;
        container.innerHTML = '';
        qr = new QRCode(container, { text: value, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.H });
        // enable download after tiny delay when QR element exists
        setTimeout(() => {
          const img = container.querySelector('img');
          if (img) {
            downloadBtn.disabled = false;
            downloadBtn.onclick = () => {
              const link = document.createElement('a');
              link.href = img.src;
              link.download = 'qrcode.png';
              link.click();
            }
          } else {
            // some browsers render canvas instead of img
            const canvas = container.querySelector('canvas');
            if (canvas) {
              downloadBtn.disabled = false;
              downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'qrcode.png';
                link.click();
              }
            }
          }
        }, 50);
      }

      btn.addEventListener('click', generate);
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          generate();
        }
      });

      // generate a sample QR on first load
      textarea.value = 'https://vercel.com';
      generate();
    </script>
  </body>
</html>
